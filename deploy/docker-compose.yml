# House deployment -> UniFi Protect:
#   reolink-floodlight-proxy  "Zvonek" Reolink doorbell, H.264 passthrough
#                             (service name kept from upstream's floodlight)
#   tapo-c120-proxy           "Garaz", H.264 passthrough
#   laview-proxy              "Backyard", H.265 main passthrough (enhanced
#                             encoding), sub stream re-encoded to HEVC
#
# Secrets (camera password, adoption token) come from an .env file that lives
# ONLY on the NAS next to this compose and is gitignored. Required vars:
#   NVR_IP, ADOPTION_TOKEN, CAM_MAC, CAM_IP, CAM_NAME, CAM_USER, CAM_PASS
#
# Protect caches capabilities (model/codec/resolution) at ADOPTION. Changing
# any of them means: remove camera in Protect UI -> fresh token into .env
# (tokens live ~60 min) -> docker compose up -d --force-recreate.
#
# Build + run on the NAS (that is where the camera network is):
#   docker compose up -d --build
services:
  reolink-floodlight-proxy:
    build:
      context: ..
      dockerfile: Dockerfile.vaapi
    image: unifi-cam-proxy:vaapi
    container_name: reolink-floodlight-proxy
    restart: unless-stopped
    # iGPU for the lo-channel h265 transcode (Protect expects EVERY
    # channel in HEVC once enhanced encoding is on).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    # Pin the Intel media driver: the image also ships Mesa (AMD) and
    # leaves libva to auto-detect. The proxy checks at startup that this
    # driver loaded and can encode ("iGPU check passed/FAILED").
    environment:
      - LIBVA_DRIVER_NAME=iHD
      - TZ=EST5EDT,M3.2.0,M11.1.0 # log timestamps only; full POSIX rule, so musl (go2rtc) needs no tzdata either
    volumes:
      - ./client.pem:/client.pem:ro
      # Scratch space (motion snapshots, per-object crops) on a bounded
      # tmpfs: the app now cleans up after itself, but a regression must
      # never again fill the host's docker.img, and a restart wipes it.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 536870912 # 512 MiB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - unifi-cam-proxy
      - -v
      - --host
      - "${NVR_IP}"
      - --cert
      - /client.pem
      - --token
      - "${ADOPTION_TOKEN}"
      - --mac
      - "${CAM_MAC}"
      - --ip
      - "${CAM_IP}"
      - --name
      - "${CAM_NAME}"
      # H.265-capable model. The default (UVC G3) is an H.264-only camera and
      # Protect gates codec capabilities by model, which would likely doom the
      # honest h265 declaration on video1.
      - --model
      - "UVC G5 Pro"
      # Full identity: Protect >=3.0 ignores the model string alone;
      # recognition keys on sysid/platform/firmwareBuild + the hex
      # camera-model WSS header. 0xa598/sav837gw = UVC G5 Pro (redalert
      # model table). fw-version must be the SHORT form with --sysid.
      - --sysid
      - "0xa598"
      - --platform
      - "sav837gw"
      # Claim the current release (what the real cameras run) so Protect
      # doesn't offer/push an upgrade to a camera that can't take one
      # (auto-update is scheduled for 03:00 on this NVR). Latest release
      # for sav837gw: https://fw-update.ui.com/api/firmware-latest?filter=eq~~platform~~sav837gw&filter=eq~~product~~uvc
      # fw-build is still 5.4.122's: newer headers are obfuscated, so the
      # real build string is unknown. A pushed newer release is adopted
      # in memory (process_upgrade) until the next restart; bump this
      # to stop the nightly push.
      - --fw-version
      - "5.5.45"
      - --fw-build
      - "92ebf37.260724.1639"
      - rtsp
      - -s
      - "rtsp://${CAM_USER}:${CAM_PASS}@${CAM_IP}:554/h264Preview_01_main"
      - "rtsp://${CAM_USER}:${CAM_PASS}@${CAM_IP}:554/h264Preview_01_sub"
      # Snapshots via the camera's HTTPS API instead of a fourth always-on
      # RTSP session (Reolink WiFi cams limit concurrent RTSP connections).
      - --snapshot-url
      - "http://${CAM_IP}/cgi-bin/api.cgi?cmd=Snap&channel=0&rs=proxy&user=${CAM_USER}&password=${CAM_PASS}"
      - --reolink-push-ai
      - --reolink-push-button
      - --reolink-scheme
      - http
      - --doorbell
      # Local non-admin UniFi OS user with write on this camera only; a
      # button press rings Protect through it (docs/DOORBELL.md).
      - --protect-ring-user
      - "${ZVONEK_ADMIN}"
      - --protect-ring-password
      - "${ZVONEK_PASS}"
      # Bridge the camera's on-board AI (person/vehicle/animal) into
      # Protect smart detections — no AI Port involved.
      - --reolink-ai-host
      - "${CAM_IP}"
      - --reolink-ai-user
      - "${CAM_USER}"
      - --reolink-ai-password
      - "${CAM_PASS}"
      # Real detection boxes arrive here from the ai-sidecar; the
      # GetAiState poller above stands down while reports are fresh.
      - --ai-sink-port
      - "7999"
      - --ai-min-confidence
      - "0.75"
      # With the sidecar's LABEL_REMAP in place the animal label is real
      # animals again (plus the low-confidence 30-40% scenery flicker
      # that used to arrive as person) — 0.8 passes actual dogs while
      # still burying the flicker.
      - --ai-confidence-overrides
      - "animal=0.6"
      # Audio must be re-encoded on FFmpeg 7.1 (the image's): copying this
      # camera's AAC (44.1k stereo) yields the config tag but ZERO audio
      # packets, in FLV and even in MKV, while decoding works. Protect then
      # gets a stream that announces audio and never sends any, and
      # restarts it every ~30s (seen 2026-10-30). 16k mono AAC is what real
      # UniFi cameras send. Timestamps still come from the camera's RTP
      # clock (wallclock stamping removed in base.py).
      - --ffmpeg-args
      - "-c:v copy -af asetpts=N/SR/TB -ar 16000 -ac 1 -c:a aac -b:a 32k"
      # Doorbell streams (probed via ffprobe): main H.264 2560x1920,
      # sub H.264 640x480, AAC 16k mono. Pure passthrough, no transcode.
      # fps = the camera's encoder setting (GetEnc: main 20, sub 10); night
      # mode drops the real rate (~17 measured), so don't declare from that.
      - --hi-codec
      - h264
      - --hi-width
      - "2560"
      - --hi-height
      - "1920"
      - --hi-fps
      - "20"
      - --lo-width
      - "640"
      - --lo-height
      - "480"
      - --lo-fps
      - "10"

  # Tapo C120 (ONVIF profiles probed 2026-11-14): H.264 2560x1440 and
  # 640x360, both 20 fps, G.711 A-law 8k audio (re-encoded to AAC below).
  # Generic rtsp source: video, recording and ONVIF motion events.
  # Start once TAPO_TOKEN is in .env: docker compose up -d tapo-c120-proxy
  tapo-c120-proxy:
    image: unifi-cam-proxy:vaapi
    container_name: tapo-c120-proxy
    restart: unless-stopped
    environment:
      - TZ=EST5EDT,M3.2.0,M11.1.0
    volumes:
      - ./client.pem:/client.pem:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - unifi-cam-proxy
      - --host
      - "${NVR_IP}"
      - --cert
      - /client.pem
      - --token
      - "${TAPO_TOKEN}"
      - --mac
      - "${TAPO_MAC}"
      - --ip
      - "${TAPO_IP}"
      - --name
      - "${TAPO_NAME}"
      - --model
      - "UVC G5 Pro"
      - --sysid
      - "0xa598"
      - --platform
      - "sav837gw"
      - --fw-version
      - "5.5.45"
      - --fw-build
      - "92ebf37.260724.1639"
      - rtsp
      - -s
      - "rtsp://${TAPO_USER}:${TAPO_PASS}@${TAPO_IP}:554/stream1"
      - "rtsp://${TAPO_USER}:${TAPO_PASS}@${TAPO_IP}:554/stream2"
      # Motion from the camera's ONVIF PullPoint (CellMotionDetector).
      - --onvif-events
      - "${TAPO_IP}:2020"
      - --onvif-user
      - "${TAPO_USER}"
      - --onvif-password
      - "${TAPO_PASS}"
      - --ffmpeg-args
      - "-c:v copy -af asetpts=N/SR/TB -ar 16000 -ac 1 -c:a aac -b:a 32k"
      - --hi-codec
      - h264
      - --hi-width
      - "2560"
      - --hi-height
      - "1440"
      - --hi-fps
      - "20"
      - --lo-width
      - "640"
      - --lo-height
      - "360"
      - --lo-fps
      - "20"

  # LaView LV-PWL2 (probed 2026-11-14): channel0 is HEVC 2560x1440 ~12 fps
  # (ONVIF wrongly says H.264), channel1 H.264 640x360. RTSP on 5543 under a
  # per-device path (LAVIEW_RTSP_PATH in .env), no auth. Main stream is
  # transcoded to H.264: CPU decode (the iGPU's HEVC decoder errors on this
  # stream) + VA-API encode. Motion via ONVIF events, no smart detections.
  # The camera allows 2 RTSP sessions, so the proxy reads via go2rtc.
  laview-go2rtc:
    image: alexxit/go2rtc:1.9.15
    container_name: laview-go2rtc
    restart: unless-stopped
    environment:
      - LAVIEW_IP=${LAVIEW_IP}
      - LAVIEW_RTSP_PATH=${LAVIEW_RTSP_PATH}
      - TZ=EST5EDT,M3.2.0,M11.1.0
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  laview-proxy:
    image: unifi-cam-proxy:vaapi
    container_name: laview-proxy
    restart: unless-stopped
    depends_on:
      - laview-go2rtc
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      - LIBVA_DRIVER_NAME=iHD
      - TZ=EST5EDT,M3.2.0,M11.1.0
    volumes:
      - ./client.pem:/client.pem:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - unifi-cam-proxy
      - --host
      - "${NVR_IP}"
      - --cert
      - /client.pem
      - --token
      - "${LAVIEW_TOKEN}"
      - --mac
      - "${LAVIEW_MAC}"
      - --ip
      - "${LAVIEW_IP}"
      - --name
      - "${LAVIEW_NAME}"
      - --model
      - "UVC G5 Pro"
      - --sysid
      - "0xa598"
      - --platform
      - "sav837gw"
      - --fw-version
      - "5.5.45"
      - --fw-build
      - "92ebf37.260724.1639"
      - rtsp
      - -s
      - rtsp://laview-go2rtc:8554/laview_main
      - rtsp://laview-go2rtc:8554/laview_sub
      # On-demand JPEG from the relay instead of an always-on snapshot ffmpeg.
      - --snapshot-url
      - http://laview-go2rtc:1984/api/frame.jpeg?src=laview_sub
      # Motion from the camera's ONVIF PullPoint (VideoSource/MotionAlarm).
      - --onvif-events
      - "${LAVIEW_IP}:8000"
      - --onvif-user
      - "${LAVIEW_USER}"
      - --onvif-password
      - "${LAVIEW_PASS}"
      - --ffmpeg-args
      - "-c:v copy -af asetpts=N/SR/TB -ar 16000 -ac 1 -c:a aac -b:a 32k"
      # Main stream is H.265 (8-bit Main, 2560x1440): passed through as-is.
      # With enhanced encoding Protect wants EVERY channel in HEVC, so only
      # the small H.264 sub stream is re-encoded to HEVC on the iGPU.
      - --lo-h265-transcode
      - --lo-transcode-bitrate
      - "400k"
      - --lo-audio-args
      - "-af asetpts=N/SR/TB -ar 16000 -ac 1 -c:a aac -b:a 32k"
      - --hw-backend
      - vaapi
      - --sw-decode
      - --hi-codec
      - h265
      - --hi-width
      - "2560"
      - --hi-height
      - "1440"
      - --hi-fps
      - "12"
      - --lo-width
      - "640"
      - --lo-height
      - "360"
      # Measured 12.0 (ONVIF claims 25 but the camera never sends it). Also
      # the GOP: -g lo-fps gives one keyframe per second.
      - --lo-fps
      - "12"

  # Decodes the camera's own AI detection rectangles (person/vehicle/
  # animal, the same boxes the Reolink app draws) off the Baichuan
  # protocol via nodelink-js, and streams them to the proxy so Protect
  # shows moving, accurately-placed detection boxes.
  reolink-ai-sidecar:
    build: ./ai-sidecar
    container_name: reolink-ai-sidecar
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - reolink-floodlight-proxy
    environment:
      - CAM_IP=${CAM_IP}
      - CAM_USER=${CAM_USER}
      - CAM_PASS=${CAM_PASS}
      - SINK_URL=http://reolink-floodlight-proxy:7999/detections
      - TZ=EST5EDT,M3.2.0,M11.1.0
      # LABEL_REMAP no longer needed: the sidecar now decodes all
      # per-class wrapper copies itself and labels by confidence.
