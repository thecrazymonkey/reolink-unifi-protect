# One camera session per channel, shared by every proxy pipeline. The
# LaView refuses a 3rd concurrent RTSP session (403 on SETUP) and the proxy
# opens 4 (video1-3 + snapshots). Values come from .env via compose.
streams:
  laview_main: rtsp://${LAVIEW_IP}:5543/${LAVIEW_RTSP_PATH}/live/channel0
  laview_sub: rtsp://${LAVIEW_IP}:5543/${LAVIEW_RTSP_PATH}/live/channel1

rtsp:
  listen: ":8554"
# Lock-down per go2rtc's security notes (needs >= 1.9.12, older versions
# silently ignore these keys): the full API can add exec: sources.
app:
  modules: [api, rtsp, ffmpeg, exec, mjpeg]
api:
  listen: ":1984" # compose network only, no published port
  allow_paths: ["/api/frame.jpeg"]
exec:
  allow_paths: [ffmpeg]
webrtc:
  listen: ""
